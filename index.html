<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<title>Kahve Usulü 101 Okey</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* Kahve Usulü 101 Okey: yatay düzen. Tüm ölçüler --u birimiyle (JS: sahne yüksekliği/100) */
:root {
  color-scheme: dark;
  --bg0: #170a2e; --bg1: #2c1252; --bg2: #3b1a6b;
  --mat0: #0b262b; --mat1: #123840; --grid: rgba(120, 235, 215, .075);
  --amber: #ffbb33; --amber2: #e98a0c; --amber-ink: #2d1800;
  --ink: #f7f0e3; --muted: #bdb0dc; --line: rgba(255, 255, 255, .14);
  --good: #4fe0a3; --bad: #ff6b5e; --info: #62c8ff;
  --panel: rgba(18, 8, 38, .78); --panel2: rgba(255, 255, 255, .08);
  --rack0: #55283f; --rack1: #2f1226;
  --ivory0: #fffaf0; --ivory1: #efe4c8; --ivory-edge: #bfae85; --ivory-lip: #8f7e5a;
  --t-red: #d2232b; --t-blk: #15151c; --t-blue: #1b5ed8; --t-yel: #e28900;
  --f-ui: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-num: 'Barlow Condensed', 'Arial Narrow', 'Barlow', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); }
body { background: var(--bg0); color: var(--ink); font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font-family: inherit; }

#stage {
  --u: 3.9px;
  position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden;
  transform-origin: 0 0; font-size: calc(var(--u) * 3.3);
  background:
    radial-gradient(ellipse at 50% 38%, rgba(160, 90, 255, .22), transparent 60%),
    linear-gradient(45deg, rgba(255, 255, 255, .035) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, .035) 75%),
    linear-gradient(45deg, rgba(255, 255, 255, .035) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, .035) 75%),
    linear-gradient(160deg, var(--bg2), var(--bg0) 70%);
  background-size: auto, calc(var(--u) * 7) calc(var(--u) * 7), calc(var(--u) * 7) calc(var(--u) * 7), auto;
  background-position: 0 0, 0 0, calc(var(--u) * 3.5) calc(var(--u) * 3.5), 0 0;
}
.app {
  position: absolute; inset: 0; padding: calc(var(--u) * 1 + var(--st, 0px)) calc(var(--u) * 1.6 + var(--sr, 0px)) calc(var(--u) * 1.6 + var(--sb, 0px)) calc(var(--u) * 1.6 + var(--sl, 0px));
  display: grid; grid-template-rows: calc(var(--u) * 7.6) minmax(0, 1fr) auto; row-gap: calc(var(--u) * .8);
}

/* ---- üst şerit ---- */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: calc(var(--u) * 1.5); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: calc(var(--u) * 1); font-family: var(--f-num); white-space: nowrap; min-width: 0; }
.brand b { font-size: calc(var(--u) * 6.4); font-weight: 800; color: var(--amber); line-height: 1; }
.brand span { font-size: calc(var(--u) * 3.6); font-weight: 700; letter-spacing: calc(var(--u) * .7); }
.brand small { font-family: var(--f-ui); font-size: calc(var(--u) * 2.3); color: var(--muted); margin-left: calc(var(--u) * .6); overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: calc(var(--u) * .8); justify-content: flex-end; }
.topbot { display: flex; justify-content: center; }

.btn {
  font-size: calc(var(--u) * 2.9); font-weight: 700; letter-spacing: .01em; color: var(--ink);
  background: rgba(255, 255, 255, .1); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.4);
  padding: 0 calc(var(--u) * 1.6); min-height: calc(var(--u) * 6.4); cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; line-height: 1.1;
}
.btn:hover { background: rgba(255, 255, 255, .17); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn.pri { background: linear-gradient(180deg, var(--amber), var(--amber2)); color: var(--amber-ink); border-color: transparent; box-shadow: 0 calc(var(--u) * .4) 0 #a85d00; }
.btn.pri:hover { filter: brightness(1.07); }
.btn.sm { min-height: calc(var(--u) * 5.4); font-size: calc(var(--u) * 2.5); padding: 0 calc(var(--u) * 1.3); }
.btn[disabled] { opacity: .36; cursor: not-allowed; box-shadow: none; }
.btn.ready { animation: glow 1.4s ease-in-out infinite; }

/* ---- masa ---- */
.board { display: grid; grid-template-columns: calc(var(--u) * 17.5) minmax(0, 1fr) calc(var(--u) * 12) calc(var(--u) * 34) calc(var(--u) * 17.5); gap: calc(var(--u) * 1); min-height: 0; }
.plate {
  background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--u) * 2);
  padding: calc(var(--u) * 1.1); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .8); min-width: 0; min-height: 0;
}
.plate.top { flex-direction: row; padding: calc(var(--u) * .5) calc(var(--u) * 1.4); gap: calc(var(--u) * 1.2); height: calc(var(--u) * 7.2); }
.plate.active { border-color: var(--amber); box-shadow: 0 0 calc(var(--u) * 2.4) rgba(255, 187, 51, .45); }
.plate.hit { animation: shake .45s; border-color: var(--bad); }
.av {
  width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--f-num); font-weight: 800; font-size: calc(var(--u) * 4); color: #fff; border: calc(var(--u) * .45) solid rgba(255, 255, 255, .85);
}
.av.a1 { background: conic-gradient(from 30deg, #e0484f, #a8238f, #e0484f); }
.av.a2 { background: conic-gradient(from 90deg, #1ea6a0, #2a6fd8, #1ea6a0); }
.av.a3 { background: conic-gradient(from 200deg, #e8a21b, #d65a1e, #e8a21b); }
.plate b.nm { font-size: calc(var(--u) * 3); line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate.top b.nm { font-size: calc(var(--u) * 3); }
.chips { display: flex; gap: calc(var(--u) * .5); flex-wrap: wrap; justify-content: center; }
.plate.top .chips { flex-wrap: nowrap; }
.chip { font-size: calc(var(--u) * 2.1); font-weight: 700; padding: calc(var(--u) * .3) calc(var(--u) * 1.1); border-radius: 99px; background: rgba(255, 255, 255, .12); color: var(--muted); white-space: nowrap; line-height: 1.2; }
.chip:first-child { color: var(--ink); }
.chip.ok { background: rgba(79, 224, 163, .2); color: #92f0c6; }
.chip.gold { background: rgba(255, 187, 51, .2); color: var(--amber); }
.chip.bad { background: rgba(255, 107, 94, .22); color: #ffaaa2; }
.pdisc { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .4); margin-top: auto; font-size: calc(var(--u) * 1.9); color: var(--muted); }
.plate.top .pdisc { flex-direction: row; margin: 0; }

.mat {
  position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-radius: calc(var(--u) * 2.2);
  border: calc(var(--u) * .5) solid #07181b; box-shadow: inset 0 0 calc(var(--u) * 5) rgba(0, 0, 0, .55), 0 calc(var(--u) * .5) calc(var(--u) * 2) rgba(0, 0, 0, .5);
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / calc(var(--u) * 5) calc(var(--u) * 5),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / calc(var(--u) * 5) calc(var(--u) * 5),
    radial-gradient(ellipse at 50% 40%, var(--mat1), var(--mat0) 80%);
}
.melds { flex: 1; min-height: 0; overflow-y: auto; padding: calc(var(--u) * 1.2); display: flex; flex-wrap: wrap; align-content: flex-start; gap: calc(var(--u) * 1 * var(--ms, 1)) calc(var(--u) * 1.2 * var(--ms, 1)); }
#melds { padding-bottom: calc(var(--u) * 1.2); }
.ticker { display: none !important; }
.empty-note { margin: auto; color: rgba(190, 240, 232, .5); font-size: calc(var(--u) * 2.8); text-align: center; }
.lane { background: rgba(0, 0, 0, .22); border-radius: calc(var(--u) * 1.4); padding: calc(var(--u) * .7) calc(var(--u) * .9); max-width: 100%; }
.lane-h { display: flex; gap: calc(var(--u) * .9); align-items: baseline; margin-bottom: calc(var(--u) * .5); font-size: calc(var(--u) * 2.5); }
.lane-h span { color: #9fdcd2; font-size: calc(var(--u) * 2.1); }
.lane-b { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .9); }
.meld { display: inline-flex; gap: calc(var(--u) * .15 * var(--ms, 1)); padding: calc(var(--u) * .35 * var(--ms, 1)); border-radius: calc(var(--u) * .9); background: rgba(0, 0, 0, .3); border: 1px solid transparent; cursor: pointer; }
.meld.accepts { border-color: var(--good); box-shadow: 0 0 calc(var(--u) * 2) rgba(79, 224, 163, .6); }
.ticker { position: absolute; left: calc(var(--u) * 1); right: calc(var(--u) * 1); bottom: calc(var(--u) * .5); font-size: calc(var(--u) * 2.1); color: #b6e4dc; line-height: 1.3; pointer-events: none; text-align: right; text-shadow: 0 1px 2px #000; }
.ticker div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .6; }
.ticker div:last-child { opacity: 1; color: #fff; font-weight: 600; }

.mid { display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: calc(var(--u) * 1.2); min-height: 0; }
.col { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(var(--u) * .8); min-height: 0; min-width: 0; }
.corner { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: calc(var(--u) * .5); min-width: 0; border-radius: calc(var(--u) * 1.4); }
.corner .ft { width: calc(var(--u) * 9); height: calc(var(--u) * 11); font-size: calc(var(--u) * 6.4); }
.corner .lbl { font-size: calc(var(--u) * 1.6); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); white-space: nowrap; line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.corner.droptarget { background: rgba(255, 187, 51, .22); }
.mat.cift .melds { padding: calc(var(--u) * 3.4) calc(var(--u) * .9) calc(var(--u) * .9); gap: calc(var(--u) * .8 * var(--ms, 1)); justify-content: flex-start; }
.mat.seri .melds { padding-top: calc(var(--u) * 3.4); }
.mat.cift .lane-h { font-size: calc(var(--u) * 2.1); flex-wrap: wrap; gap: calc(var(--u) * .5); }
.mat.cift .empty-note, .mat.seri .empty-note { font-size: calc(var(--u) * 2.6); }
.mat.cift .empty-note { font-size: calc(var(--u) * 2.2); }
.mat::before { position: absolute; top: calc(var(--u) * .6); right: calc(var(--u) * 1.2); font-size: calc(var(--u) * 1.7); font-weight: 800; letter-spacing: .12em; color: rgba(190, 240, 232, .28); pointer-events: none; }
.mat.seri::before { content: 'SERİ PERLER'; }
.mat.cift::before { content: 'ÇİFTLER'; }
.box { min-height: 0; padding: calc(var(--u) * .8) 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * .35); border-radius: calc(var(--u) * 1.5); background: var(--panel); border: 1px solid var(--line); }
.box .lbl { margin-top: calc(var(--u) * .7); font-size: calc(var(--u) * 1.6); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); white-space: nowrap; line-height: 1; }
.dropzone { border-radius: calc(var(--u) * 1); }

/* ---- taşlar ---- */
.tile {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none;
  background: linear-gradient(170deg, var(--ivory0), var(--ivory1)); border-radius: calc(var(--u) * .9);
  box-shadow: 0 calc(var(--u) * .45) 0 var(--ivory-lip), 0 calc(var(--u) * .7) calc(var(--u) * .8) rgba(0, 0, 0, .55), inset 0 0 0 1px var(--ivory-edge);
  line-height: 1; font-size: calc(var(--u) * 4.4);
}
.tile .n { font-family: var(--f-num); font-weight: 800; font-size: 1em; letter-spacing: -.02em; }
.tile .ring { width: .3em; height: .3em; border-radius: 50%; background: currentColor; margin-top: .12em; box-shadow: inset 0 0 0 .07em rgba(255, 255, 255, .55); }
.tile .fk { font-size: .78em; color: #7b3fa0; }
.tile .sm { font-family: var(--f-num); font-weight: 700; font-size: .46em; margin-top: .1em; }
.c0 { color: var(--t-red); } .c1 { color: var(--t-blk); } .c2 { color: var(--t-blue); } .c3 { color: var(--t-yel); }
.fkv { width: .9em; height: .9em; }
.tile.back { background: linear-gradient(170deg, #ffffff, #e6e6ea); box-shadow: 0 calc(var(--u) * .45) 0 #a9a9b4, 0 calc(var(--u) * .7) calc(var(--u) * .8) rgba(0, 0, 0, .55), inset 0 0 0 1px #c9c9d2; }
.tile.back .cnt { width: 1.45em; height: 1.45em; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-weight: 800; font-size: .62em; color: #14141a; background: radial-gradient(circle at 50% 38%, #f6f6f8, #cfcfd6); box-shadow: inset 0 calc(var(--u) * .15) calc(var(--u) * .4) rgba(0, 0, 0, .35); }
.tile.blank { background: linear-gradient(170deg, #ffffff, #ececf0); }
.ft { width: calc(var(--u) * 5); height: calc(var(--u) * 6.8); font-size: calc(var(--u) * 3.9); }
.mid .ft { width: calc(var(--u) * 9); height: calc(var(--u) * 11); font-size: calc(var(--u) * 6.4); }
.ft.empty { background: rgba(0, 0, 0, .25); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .55); border: 1px dashed rgba(255, 255, 255, .2); }
.ft.okeyface { box-shadow: 0 0 0 calc(var(--u) * .4) var(--amber), 0 calc(var(--u) * .5) calc(var(--u) * .7) rgba(0, 0, 0, .5); }
.mt { width: calc(var(--u) * 4.7 * var(--ms, 1)); height: calc(var(--u) * 6.5 * var(--ms, 1)); font-size: calc(var(--u) * 3.7 * var(--ms, 1)); cursor: pointer; box-shadow: 0 calc(var(--u) * .3) 0 var(--ivory-lip), inset 0 0 0 1px var(--ivory-edge); }
.mt.swapok { box-shadow: 0 0 0 calc(var(--u) * .4) var(--good), 0 0 calc(var(--u) * 1.6) var(--good); }
.pulse { position: relative; cursor: pointer; }
.pulse::after { content: ''; position: absolute; inset: calc(var(--u) * -.6); border-radius: inherit; box-shadow: 0 0 calc(var(--u) * 1.4) calc(var(--u) * .4) rgba(255, 187, 51, .9); opacity: 0; animation: pulse 1.3s ease-in-out infinite; pointer-events: none; will-change: opacity; }

/* ---- alt bölüm ---- */
.me { display: grid; grid-template-columns: minmax(0, 1fr); padding: 0 calc(var(--u) * 17.5); align-items: stretch; min-width: 0; }
.srow { display: flex; align-items: flex-end; gap: calc(var(--u) * 1.2); min-width: 0; }
.srow .status { flex: 1; min-width: 0; }
.bk { display: grid; gap: calc(var(--u) * .7); align-content: end; min-width: 0; }
.bk.left { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: calc(var(--u) * 7.8); }
.bk.right { display: flex; flex-direction: row; gap: calc(var(--u) * .7); flex: none; align-content: unset; }
.bk.right .btn { width: auto; height: calc(var(--u) * 5.6); padding: 0 calc(var(--u) * 1.5); font-size: calc(var(--u) * 2.4); white-space: nowrap; }
.bk .btn { width: 100%; min-width: 0; min-height: 0; height: 100%; padding: 0 calc(var(--u) * .4); font-size: calc(var(--u) * 2.6); overflow: hidden; }
.bk .btn.big { font-size: calc(var(--u) * 2.7); white-space: normal; text-align: center; line-height: 1.05; }
.rackwrap { min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: calc(var(--u) * .5); }
.status { font-size: calc(var(--u) * 2.3); min-height: calc(var(--u) * 3.6); line-height: 1.15; padding: 0 calc(var(--u) * .6); color: #e4dcf5; display: flex; gap: calc(var(--u) * 1.5); align-items: center; justify-content: space-between; overflow: hidden; }
.status span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.status.bad { color: #ffc0b9; font-weight: 700; }
.status .who { font-family: var(--f-num); font-weight: 700; letter-spacing: .04em; color: var(--amber); white-space: nowrap; flex: none; }
.rackbox {
  border-radius: calc(var(--u) * 2.2); padding: calc(var(--u) * .9) calc(var(--u) * 1); position: relative;
  background: linear-gradient(180deg, var(--rack0), var(--rack1)); border: calc(var(--u) * .35) solid #1b0a17;
  box-shadow: inset 0 calc(var(--u) * .35) 0 rgba(255, 187, 51, .45), 0 calc(var(--u) * .8) calc(var(--u) * 2) rgba(0, 0, 0, .55);
}
.rackbox.myturn { box-shadow: inset 0 calc(var(--u) * .35) 0 rgba(255, 187, 51, .45), 0 0 0 calc(var(--u) * .35) var(--amber), 0 0 calc(var(--u) * 3) rgba(255, 187, 51, .4); }
.rack { display: flex; flex-direction: column; gap: calc(var(--u) * .8); }
.rrow { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: calc(var(--u) * .25); padding: calc(var(--u) * .5) calc(var(--u) * .4); border-radius: calc(var(--u) * 1); background: rgba(14, 4, 12, .55); box-shadow: inset 0 calc(var(--u) * .4) calc(var(--u) * .8) rgba(0, 0, 0, .6); height: calc(var(--u) * 12.8); }
.slot { position: relative; border-radius: calc(var(--u) * .7); background: rgba(0, 0, 0, .25); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .55); min-width: 0; }
.rack .tile { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--u) * .6); width: auto; height: auto; font-size: calc(var(--u) * 6.8); touch-action: none; cursor: grab; }
.rack .tile.sel { transform: translateY(-14%); box-shadow: 0 0 0 calc(var(--u) * .4) var(--amber), 0 calc(var(--u) * 1) calc(var(--u) * 1.2) rgba(0, 0, 0, .6); z-index: 2; }
.rack .tile.inm::after, .rack .tile.inp::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: 5%; height: 8%; border-radius: 3px; background: #19c47a; }
.rack .tile.inp::after { background: var(--amber2); }
.rack .tile.fresh { animation: pop .6s ease-out; outline: 2px solid var(--info); outline-offset: 1px; }
.rack .tile.dragging { visibility: hidden; }
.rack .tile .hw { position: absolute; left: 6%; top: 4%; width: 1.1em; height: 1.1em; border-radius: 50%; background: var(--bad); color: #fff; font-style: normal; font-size: .4em; display: grid; place-items: center; font-weight: 800; }
.ghost { position: fixed; z-index: 8000; pointer-events: none; margin: 0; will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden; transition: none !important; animation: none !important; box-shadow: 0 6px 14px rgba(0, 0, 0, .45), inset 0 0 0 1px var(--ivory-edge); }
.droptarget { outline: 2px solid var(--amber) !important; outline-offset: 1px; }
.slot.droptarget { background: rgba(255, 187, 51, .3); }

/* ---- yazboz çekmecesi ---- */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(calc(var(--u) * 82), 100%); z-index: 90; transform: translateX(105%); transition: transform .25s ease; background: #14072b; border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0, 0, 0, .6); padding: calc(var(--u) * 1.6); display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: calc(var(--u) * 1); }
.drawer-h h2 { margin: 0; font-family: var(--f-num); font-size: calc(var(--u) * 5.4); letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
.drawer-b { overflow: auto; flex: 1; }
.sc { width: 100%; border-collapse: collapse; font-size: calc(var(--u) * 2.6); }

<div id="stage" lang="tr">
  <div class="app">

<script>
'use strict';
/* =====================================================================
   101 OKEY MOTORU  (saf mantık, DOM yok)
   Taş: {id, c:0-3, n:1-13, fake:bool, wild:bool}
   c: 0 Kırmızı, 1 Siyah, 2 Mavi, 3 Sarı
   wild  = gerçek Okey (joker)  -> her taşın yerine geçer
   fake  = Sahte Okey           -> okey taşının yüzüyle (c,n) doğal taş gibi davranır
   ===================================================================== */
const COLOR_NAMES = ['Kırmızı', 'Siyah', 'Mavi', 'Sarı'];
const COLS = 15;            // ıstaka sütunu
const ROWS = 2;             // ıstaka sırası
let RNG = Math.random;
function setRng(f) { RNG = f; }
function rand() { return RNG(); }
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(RNG() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function tileName(t) {
  if (t.fake) return 'Sahte Okey';
  return COLOR_NAMES[t.c] + ' ' + t.n;
}
function faceName(c, n) { return COLOR_NAMES[c] + ' ' + n; }

/* ---------- Deste ve dağıtım ---------- */
function makeDeck() {
  const tiles = []; let id = 0;
  for (let copy = 0; copy < 2; copy++)
    for (let c = 0; c < 4; c++)
      for (let n = 1; n <= 13; n++)
        tiles.push({ id: id++, c, n, fake: false, wild: false });
  tiles.push({ id: id++, c: -1, n: 0, fake: true, wild: false });
  tiles.push({ id: id++, c: -1, n: 0, fake: true, wild: false });
  return tiles; // 106 taş
}

// starter 22 taş, diğerleri 21 taş. Kalan: 106 - 1 (gösterge) - 85 = 20
function dealHand(starter) {
  const deck = shuffle(makeDeck());
  let g;
  for (;;) {
    g = deck.pop();
    if (!g.fake) break;                       // gösterge sahte okey olamaz
    deck.splice(Math.floor(RNG() * (deck.length + 1)), 0, g);
  }
  const okey = { c: g.c, n: g.n === 13 ? 1 : g.n + 1 };
  g.wild = false;
  for (const t of deck) {
    if (t.fake) { t.c = okey.c; t.n = okey.n; t.wild = false; }
    else t.wild = (t.c === okey.c && t.n === okey.n);
  }
  const hands = [];
  for (let i = 0; i < 4; i++) {
    const cnt = i === starter ? 22 : 21;
    hands.push(deck.splice(deck.length - cnt, cnt));
  }
  return { deck, gosterge: g, okey, hands };
}

/* ---------- Per analizi ---------- */
// Seri (aynı renk ardışık). 1 yalnızca başta (1-2-3) olabilir, 12-13-1 geçersiz; 1 her zaman 1 puan.
function analyzeRun(tiles) {
  const len = tiles.length;
  if (len < 3 || len > 13) return null;
  const wilds = tiles.filter(t => t.wild);
  const real = tiles.filter(t => !t.wild);
  if (real.length < 1) return null;
  const color = real[0].c;
  for (const t of real) if (t.c !== color) return null;
  const pos = real.map(t => ({ t, p: t.n })).sort((a, b) => a.p - b.p);
  for (let i = 1; i < pos.length; i++) if (pos[i].p === pos[i - 1].p) return null;
  const mn = pos[0].p, mx = pos[pos.length - 1].p;
  const gaps = (mx - mn + 1) - pos.length;
  if (gaps > wilds.length) return null;
  let extra = wilds.length - gaps, lo = mn, hi = mx;
  const addHi = Math.min(extra, 13 - hi); hi += addHi; extra -= addHi;
  const addLo = Math.min(extra, lo - 1); lo -= addLo; extra -= addLo;
  if (extra > 0) return null;
  const byP = new Map(pos.map(x => [x.p, x.t]));
  const wq = wilds.slice();
  const items = [];
  for (let p = lo; p <= hi; p++) items.push({ t: byP.get(p) || wq.shift(), c: color, n: p, p });
  return { kind: 'series', type: 'run', items, value: items.reduce((s, i) => s + i.p, 0) };
}
// Küt (aynı sayı, farklı renkler), 3 veya 4 taş
function analyzeSet(tiles) {
  const len = tiles.length;
  if (len < 3 || len > 4) return null;
  const real = tiles.filter(t => !t.wild), wilds = tiles.filter(t => t.wild);
  if (!real.length) return null;
  const n = real[0].n;
  for (const t of real) if (t.n !== n) return null;
  const cols = real.map(t => t.c);
  if (new Set(cols).size !== cols.length) return null;
  const missing = [0, 1, 2, 3].filter(c => !cols.includes(c));
  if (wilds.length > missing.length) return null;
  const items = real.map(t => ({ t, c: t.c, n }));
  wilds.forEach((w, i) => items.push({ t: w, c: missing[i], n }));
  items.sort((a, b) => a.c - b.c);
  return { kind: 'series', type: 'set', items, value: n * len };
}
function analyzeMeld(tiles) {
  const r = analyzeRun(tiles), s = analyzeSet(tiles);
  if (r && s) return r.value >= s.value ? r : s;
  return r || s;
}
// Yan yana duran bir grubu en iyi şekilde perlere böl (aradaki tek taşları atlayabilir)
function parseGroup(g) {
  // Yan yana duran grubun TÜM taşları perlere bölünebilmeli; araya karışan alakasız (okey olmayan) taş varsa grup per sayılmaz.

  const n = g.length;

function act(a) {
  initAudio();
  let r;
  const sel = Array.from(UI.selected);
  switch (a) {
    case 'arr-seri': if (hardMode()) break; UI.prefer = 'seri'; hArrange('seri'); render(); break;
    case 'arr-cift': if (hardMode()) break; UI.prefer = 'cift'; hArrange('cift'); render(); break;
    case 'arr-sort': hArrange('sort'); render(); break;
    case 'draw-deck': r = hDraw('deck'); feedback(r); if (r && r.ok && r.msg) UI.statusMsg = null; render(); break;
    case 'draw-side': r = hDraw('side'); feedback(r); render(); break;
    case 'open': r = hOpen(UI.prefer); feedback(r); if (r.ok) UI.selected.clear(); render(); break;
    case 'regather': r = hRegather(); feedback(r); render(); break;
    case 'process-all': r = hProcessAll(); feedback(r); render(); break;
    case 'process': {
      const P = G.players[0];
      r = P.opened && P.openKind === 'cift' ? hProcessPairs(sel) : hProcess(sel, null);
      feedback(r); render(); break;
    }
    case 'discard': if (sel.length === 1) { r = hDiscard(sel[0]); feedback(r); UI.selected.clear(); } render(); break;
    case 'open-seri': { const P = G.players[0]; r = !P.opened ? hOpen('seri', true) : hLay(); feedback(r); if (r.ok) UI.selected.clear(); render(); break; }
    case 'open-cift': { const P = G.players[0]; r = !P.opened ? hOpen('cift', true) : hProcessPairs(sel.length >= 2 ? sel : []); feedback(r); if (r.ok) UI.selected.clear(); render(); break; }
    case 'score': toggleDrawer(true); break;
    case 'rules': showRules(!!$('modal').classList.contains('show') && !!document.querySelector('[data-act="start"]')); break;
    case 'menu': showMenu(false); break;
    case 'settings': showMenu(false); break;
    case 'sound': UI.settings.sound = !UI.settings.sound; saveSettings(); initAudio(); render(); break;
    case 'start': startNew(); break;
    case 'close': closeModal(); break;
    case 'next': closeModal(); nextHand(); break;
    default: break;
  }
}

// İmleç ıstakada nerede: hangi yuva ve yuvanın sağ yarısı mı (stage koordinatlarında, dönmeye dayanıklı)
function slotCache() {
  if (UI.sc) return UI.sc;
  const rows = {};
  document.querySelectorAll('#rack .slot').forEach(el => {
    const r = el.getBoundingClientRect(), c = toStage(r.left + r.width / 2, r.top + r.height / 2);
    const i = +el.dataset.slot, row = Math.floor(i / COLS);
    (rows[row] = rows[row] || []).push({ i, cx: c.x, cy: c.y });
  });
  const b = $('rackbox').getBoundingClientRect();
  return (UI.sc = { rows, box: { l: b.left, r: b.right, t: b.top, b: b.bottom } });
}
function rackSlotAt(x, y) {
  const sc = slotCache(), box = { left: sc.box.l, right: sc.box.r, top: sc.box.t, bottom: sc.box.b };
  const pad = 14;
  if (x < box.left - pad || x > box.right + pad || y < box.top - pad || y > box.bottom + pad) return null;
  const p = toStage(x, y), rows = sc.rows;
  let best = null, bd = 1e9;
  Object.keys(rows).forEach(k => { const cy = rows[k][0].cy, d = Math.abs(p.y - cy); if (d < bd) { bd = d; best = rows[k]; } });
  if (!best) return null;
  let s = best[0], sd = 1e9;
  best.forEach(o => { const d = Math.abs(p.x - o.cx); if (d < sd) { sd = d; s = o; } });
  return { s: s.i, after: p.x > s.cx };
}
function showInsert(x, y) {
  const h = rackSlotAt(x, y);
  const key = h ? h.s + (h.after ? 'r' : 'l') : '';
  if (UI.insKey === key) return h;           // değişiklik yoksa DOM'a dokunma
  UI.insKey = key;
  if (UI.insEl) { UI.insEl.classList.remove('ins-l', 'ins-r'); UI.insEl = null; }
  if (!h) return null;
  const el = document.querySelector('#rack .slot[data-slot="' + h.s + '"]');
  if (el && el.querySelector('.tile')) { el.classList.add(h.after ? 'ins-r' : 'ins-l'); UI.insEl = el; }
  return h;
}
function handleDrop(id, el, x, y) {
  if (!el) return;
  const P = G.players[0];
  const slot = el.closest('.slot');
  const dz = el.closest('[data-drop="discard"]');
  const mt = el.closest('.mt');
  const meld = el.closest('.meld');
  const hit = x !== undefined ? rackSlotAt(x, y) : null;
  if (hit || (slot && slot.closest('#rack'))) {
    const from = P.slots.findIndex(t => t && t.id === id);
    if (hit) hInsert(from, hit.s, hit.after); else hMove(from, +slot.dataset.slot);
    return;
  }
  const sz = el.closest('[data-drop="side"]');
  if (sz) {
    if (P.sideTile && !P.sideUsed && P.sideTile.id === id) feedback(hReturnSide());
    else toast('Sadece yandan aldığın taşı geri bırakabilirsin.', 'bad');
    return;
  }
  if (dz) { tryDiscardTile(id); return; }
  if (meld) {
    const mid = +meld.dataset.meld;
    if (mt && mt.dataset.joker === '1') feedback(hSwap(id, mid, +mt.dataset.idx));
    else feedback(hProcess([id], mid));
    UI.selected.delete(id);
  }
}

/* ---------- Sürükle-bırak (fare + dokunmatik) ---------- */
function killGhosts() { document.querySelectorAll('.ghost').forEach(x => x.remove()); }
function guardDown(e) {
  if (e.isPrimary === false) return false;      // ikinci parmak: yok say
  if (drag) { if (drag.raf) cancelAnimationFrame(drag.raf); clearTimeout(drag.timer); clearTimeout(drag.timer2); drag = null; }
  killGhosts();
  document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  return true;
}
function onDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  const el = e.target.closest('.tile[data-id]');
  if (!el || !G) return;
  if (!guardDown(e)) return;
  initAudio();
  drag = { pid: e.pointerId, id: +el.dataset.id, el, sx: e.clientX, sy: e.clientY, moved: false, ghost: null, target: null, peeked: false, timer: null };
  const pt = G.players[0].slots.find(x => x && x.id === drag.id);
  if (pt && isGostTwin(pt) && canAnnounce(G.players[0])) {   // göstergeyi basılı tutarak "Gösterge bende"
    const d = drag;
    d.gostT = Date.now();
    d.timer = setTimeout(() => { if (drag === d && !d.moved && !d.peeked) { d.peeked = true; feedback(announceGost(0)); render(); } }, 350);
  } else if (pt && pt.wild) {
    const d = drag;
    d.timer = setTimeout(() => { if (drag === d && !d.moved) { d.peeked = true; UI.peekId = d.id; d.el.classList.add('peek'); } }, 320);
    d.timer2 = setTimeout(() => { if (drag === d && !d.moved) { pt.mark = !pt.mark; d.marked = true; d.el.classList.toggle('peek', true); } }, 1000);
  }
}
function onDownSrc(e) {
  if (e.button !== undefined && e.button !== 0) return;
  const el = e.target.closest('[data-dragsrc]');
  if (!el || !G || !humanCan('draw')) return;
  if (!guardDown(e)) return;
  initAudio();
  drag = { pid: e.pointerId, src: el.dataset.dragsrc, el, sx: e.clientX, sy: e.clientY, moved: false, ghost: null, target: null };
}
function dropDraw(src, el, x, y) {
  const slot = el && el.closest('.slot'), box = el && el.closest('#rackbox');
  const hit = x !== undefined ? rackSlotAt(x, y) : null;
  if (!slot && !box && !hit) return;
  const r = hDraw(src);
  feedback(r);
  if (r && r.ok && r.tile && (hit || slot)) {
    const P = G.players[0], from = P.slots.indexOf(r.tile);
    if (from >= 0) { if (hit) hInsert(from, hit.s, hit.after); else if (!P.slots[+slot.dataset.slot]) hMove(from, +slot.dataset.slot); }
  }
}
function applyDrag() {
  const d = drag; if (!d) return;
  d.raf = 0;
  if (!d.ghost) return;
  const inRack = showInsert(d.px, d.py);
  let t = null;
  if (!inRack) {
    const el = document.elementFromPoint(d.px, d.py);
    t = el ? (el.closest('.slot') || el.closest('[data-drop]') || el.closest('.mt') || el.closest('.meld') || (d.src ? el.closest('#rackbox') : null)) : null;
  }
  const tt = (t && t.classList && (t.classList.contains('slot') || t.id === 'rackbox')) ? null : t;
  if (tt !== d.target) {
    if (d.target) d.target.classList.remove('droptarget');
    if (tt) tt.classList.add('droptarget');
    d.target = tt;
  }
}
function onMove(e) {
  if (!drag) return;
  if (drag.pid !== undefined && e.pointerId !== drag.pid) return;
  if (e.pointerType === 'mouse' && e.buttons === 0) { endDrag(e, true); return; }
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
    if (drag.peeked) { drag.peeked = false; UI.peekId = null; drag.el.classList.remove('peek'); }
    clearTimeout(drag.timer); clearTimeout(drag.timer2);
    drag.moved = true;
    const r = drag.el.getBoundingClientRect();
    const g = drag.el.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('sel', 'inm', 'inp', 'fresh', 'pulse');
    if (drag.src === 'deck') { g.innerHTML = ''; g.classList.remove('back'); g.classList.add('blank'); }
    g.style.fontSize = getComputedStyle(drag.el).fontSize;
    g.style.width = drag.el.offsetWidth + 'px'; g.style.height = drag.el.offsetHeight + 'px';
    g.style.setProperty('--u', getComputedStyle($('stage')).getPropertyValue('--u'));
    document.body.appendChild(g);                       // sahnenin dışında, kendi katmanında: iz bırakmaz
    g.style.left = '0px'; g.style.top = '0px';
    drag.ghost = g; drag.w = drag.el.offsetWidth; drag.h = drag.el.offsetHeight; UI.sc = null; slotCache();
    const tl = toStage(r.left, r.top), sp0 = toStage(drag.sx, drag.sy);
    drag.ox = sp0.x - tl.x; drag.oy = sp0.y - tl.y;               // parmağın taş üzerindeki yeri korunur
    if (drag.ox < 0 || drag.ox > drag.w || drag.oy < 0 || drag.oy > drag.h) { drag.ox = drag.w / 2; drag.oy = drag.h / 2; }
    UI.insKey = null; UI.insEl = null;
    if (!drag.src) drag.el.classList.add('dragging');
  }
  drag.px = e.clientX; drag.py = e.clientY;
  if (drag.ghost) {                                     // taş parmağı anında izler; hedef hesabı kare başına bir kez
    const s = toStage(drag.px, drag.py);
    drag.gx = s.x - drag.ox; drag.gy = s.y - drag.oy;
    drag.ghost.style.transform = 'translate3d(' + drag.gx + 'px,' + drag.gy + 'px,0) scale(1.08) rotate(-2deg)';
  }
  if (!drag.raf) drag.raf = requestAnimationFrame(applyDrag);
  if (e.cancelable) e.preventDefault();
}
function endDrag(e, cancel) {
  if (!drag) return;
  if (e && drag.pid !== undefined && e.pointerId !== undefined && e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  if (d.raf) cancelAnimationFrame(d.raf);
  clearTimeout(d.timer); clearTimeout(d.timer2);
  if (UI.peekId) { UI.peekId = null; }
  killGhosts();
  if (d.peeked) { render(); return; }
  if (d.src) {
    if (d.moved) { UI.noClick = Date.now(); if (!cancel) dropDraw(d.src, document.elementFromPoint(e.clientX, e.clientY), e.clientX, e.clientY); render(); }
    return;
  }
  document.querySelectorAll('.droptarget').forEach(x => x.classList.remove('droptarget'));
  document.querySelectorAll('.ins-l, .ins-r').forEach(x => x.classList.remove('ins-l', 'ins-r'));
  if (d.gostT && !d.peeked && !d.moved && Date.now() - d.gostT >= 300 && canAnnounce(G.players[0])) { feedback(announceGost(0)); render(); return; }
  if (!d.moved) { if (!cancel) handleTap(d.id); return; }
  if (d.ghost && d.gx !== undefined) UI.dropFrom = { id: d.id, x: d.gx, y: d.gy };
  if (UI.insEl) { UI.insEl.classList.remove('ins-l', 'ins-r'); UI.insEl = null; } UI.insKey = null;
  if (!cancel) handleDrop(d.id, document.elementFromPoint(e.clientX, e.clientY), e.clientX, e.clientY);
  render(); UI.dropFrom = null;
}

/* ---------- Kancalar ve açılış ---------- */
H.render = render;
H.log = line => { UI.tickerLines.push(line); if (G) { try { renderTicker(); } catch (e) { /* yok say */ } } };
H.toast = toast;
H.banner = banner;
H.sfx = n => { if (SFX[n]) SFX[n](); };
H.wait = ms => new Promise(res => setTimeout(res, ms));
H.handStart = () => { UI.selected.clear(); UI.prefer = 'seri'; UI.statusMsg = null; };
H.handEnd = (rec, last) => {
  render();
  const special = rec.kind !== 'normal' && rec.kind !== 'draw';
  setTimeout(() => { if (G && G.phase === 'over') showHandEnd(rec, last); }, special ? 2300 : (rec.kind === 'draw' ? 600 : 1500));
};
H.gameEnd = () => { showGameEnd(); };
// ceza alan botu salla
const _origToast = H.toast;
H.toast = (m, k) => {
  _origToast(m, k);
  if (G) { const idx = G.players.findIndex(p => !p.human && m.indexOf(p.name + ' yanlışa') === 0); if (idx > 0) { UI.hitBot = idx; setTimeout(() => { UI.hitBot = -1; render(); }, 600); } }
};

function toStage(X, Y) { return UI.port ? { x: Y, y: window.innerWidth - X } : { x: X, y: Y }; }
function insets() {
  let p = document.getElementById('inprobe');
  if (!p) {
    p = document.createElement('div'); p.id = 'inprobe';
    p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
    document.body.appendChild(p);
  }
  const s = getComputedStyle(p);
  return { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
}
function layout() {
  const w = window.innerWidth, h = window.innerHeight, port = false;
  // oyun sadece yatay oynanır: dikeyde "telefonu yan çevir" uyarısı
  let rm = document.getElementById('rotMsg');
  if (!rm) {
    rm = document.createElement('div'); rm.id = 'rotMsg';
    rm.innerHTML = '<div class="rot-ic"><div class="rot-ph"></div></div><b>Telefonu yan çevir</b><span>Kahve Usulü 101 Okey yatay oynanır</span>';
    document.body.appendChild(rm);
  }
  rm.hidden = !(h > w);
  const sw = port ? h : w, sh = port ? w : h, st = $('stage');
  st.style.width = sw + 'px'; st.style.height = sh + 'px';
  st.style.transform = port ? 'translateX(' + w + 'px) rotate(90deg)' : 'none';
  st.style.setProperty('--u', Math.max(2.4, Math.min(sh / 100, sw / 200)) + 'px');
  const n = insets();
  // sahne koordinatlarında güvenli alan: dikeyde sahne 90° döndüğü için ekranın üstü = sahnenin solu
  const m = port ? { l: n.t, r: n.b, t: n.r, b: n.l } : { l: n.l, r: n.r, t: n.t, b: n.b };
  st.style.setProperty('--sl', m.l + 'px'); st.style.setProperty('--sr', m.r + 'px');
  st.style.setProperty('--st', m.t + 'px'); st.style.setProperty('--sb', m.b + 'px');
  UI.port = port;
  if (G) try { fitMats(); } catch (e) { /* yok say */ }
}
/* ---------- Tur süresi (60 sn) ---------- */
const TURN_SEC = 60;
function clockKey() { return G && G.turn === 0 && (G.phase === 'draw' || G.phase === 'discard') && !G.players[0].bot ? G.handNo + ':' + G.turnNo + ':' + (G.clk || 0) : null; }
function clockTick() {
  const now = Date.now(), dt = now - (UI.cLast || now); UI.cLast = now;
  const key = clockKey(), el = $('clock');
  if (!key) { if (el) el.hidden = true; UI.cKey = null; return; }
  if (key !== UI.cKey) { UI.cKey = key; UI.cEnd = now + TURN_SEC * 1000; }
  const paused = document.hidden || $('modal').classList.contains('show') || (UI.drawerOpen === true);
  if (paused || drag) UI.cEnd += dt;                    // pencere açıkken / sürüklerken süre durur
  const left = Math.max(0, UI.cEnd - now), s = Math.ceil(left / 1000);
  if (el) {
    el.hidden = false;
    el.textContent = '0:' + String(s).padStart(2, '0');
    el.classList.toggle('warn', s <= 10);
    el.style.setProperty('--p', (left / (TURN_SEC * 1000)).toFixed(3));
  }
  if (left <= 0 && !paused && !drag && !UI.autoBusy) autoPlay();
}
function autoPlay() {
  UI.autoBusy = true;
  try {
    const P = G.players[0];
    if (G.phase === 'discard' && P.sideTile && !P.sideUsed) hReturnSide();
    if (G.phase === 'draw') { const r = hDraw('deck'); if (!r || !r.ok) { UI.autoBusy = false; render(); return; } }
    if (G.phase === 'discard' && G.turn === 0) {
      const tiles = P.slots.filter(Boolean);
      const score = t => (t.wild ? 1000 : 0) + (G.table.length && isWrongDiscard(t, G.table) ? 500 : 0) + (t.id === G.freshId ? -50 : 0) - t.n;
      const order = tiles.slice().sort((a, b) => score(a) - score(b));
      for (const t of order) { const r = hDiscard(t.id); if (r && r.ok) break; }
    }
    warn('Süren doldu: senin yerine taş çekilip atıldı.');
  } finally { UI.autoBusy = false; UI.cKey = null; render(); }
}
function init() {
  loadSettings();
  layout();
  setInterval(clockTick, 250);
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  document.addEventListener('click', e => {
    if (UI.noClick && Date.now() - UI.noClick < 400) return;
    const b = e.target.closest('[data-act]');
    if (b && !b.disabled) { act(b.dataset.act); return; }
    const tg = e.target.closest('[data-tog]');
    if (tg) {
      const k = tg.dataset.tog, v = !chipOn(k);
      if (k.indexOf('pen.') === 0) UI.settings.pen[k.slice(4)] = v; else UI.settings[k] = v;
      tg.classList.toggle('on', v); saveSettings(); return;
    }
    const sg = e.target.closest('[data-segv]');
    if (sg) {
      const key = sg.parentNode.dataset.seg;
      let v = sg.dataset.segv;
      if (key === 'hands') v = +v; else if (key === 'sound' || key === 'hard' || key === 'team' || key.indexOf('pen.') === 0) v = v === 'true';
      if (key.indexOf('pen.') === 0) UI.settings.pen[key.slice(4)] = v; else UI.settings[key] = v;
      Array.from(sg.parentNode.children).forEach(x => x.classList.toggle('on', x === sg));
      if (key === 'sound') initAudio();
      saveSettings();
    }
  });
  $('melds').addEventListener('click', e => {
    const m = e.target.closest('.meld');
    if (!m || !G) return;
    const mt = e.target.closest('.mt');
    const mid = +m.dataset.meld, sel = Array.from(UI.selected);
    if (mt && mt.dataset.joker === '1') {
      if (sel.length !== 1) { warn('Okeyi almak için önce yerine koyacağın gerçek taşı rafından seç.'); return; }
      feedback(hSwap(sel[0], mid, +mt.dataset.idx)); render(); return;
    }
    if (!sel.length) { warn('Önce rafından işlemek istediğin taşı seç.'); return; }
    feedback(hProcess(sel, mid)); render();
  });
  $('melds2').addEventListener('click', e => {           // çiftteki okeyi alma
    const m = e.target.closest('.meld'), mt = e.target.closest('.mt');
    if (!m || !mt || !G || mt.dataset.joker !== '1') return;
    const sel = Array.from(UI.selected);
    if (sel.length !== 1) { warn('Okeyi almak için önce yerine koyacağın gerçek taşı rafından seç.'); return; }
    feedback(hSwap(sel[0], +m.dataset.meld, +mt.dataset.idx)); render();
  });
  $('btnScore').addEventListener('click', () => toggleDrawer());
  $('btnScoreClose').addEventListener('click', () => toggleDrawer(false));
  $('btnRules').addEventListener('click', () => showRules(false));
  $('btnSettings').addEventListener('click', () => showMenu(false));
  $('btnSound').addEventListener('click', () => act('sound'));
  const rack = $('rack');
  rack.addEventListener('pointerdown', onDown);
  $('center').addEventListener('pointerdown', onDownSrc);
  $('dBL').addEventListener('pointerdown', onDownSrc);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));
  window.addEventListener('blur', () => { if (drag) endDrag({ pointerId: drag.pid, clientX: 0, clientY: 0 }, true); killGhosts(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && drag) endDrag({ pointerId: drag.pid, clientX: 0, clientY: 0 }, true); killGhosts(); });
  window.addEventListener('blur', e => endDrag(e, true));
  rack.addEventListener('contextmenu', e => e.preventDefault());
  newGame({ mode: UI.settings.mode, hands: UI.settings.hands, team: UI.settings.team, speed: 'normal', hard: UI.settings.hard, pen: UI.settings.pen });
  showMenu(true);
}
init();

</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{
 const ask=w=>{if(w&&navigator.serviceWorker.controller){const b=document.createElement('div');b.textContent='Yeni sürüm var — dokun, yenile';b.style.cssText='position:fixed;left:50%;top:8px;transform:translateX(-50%);background:#ffbb33;color:#2d1800;padding:8px 14px;border-radius:20px;font:600 14px sans-serif;z-index:9999;cursor:pointer';b.onclick=()=>{w.postMessage('skip')};document.body.appendChild(b);}};
 if(r.waiting)ask(r.waiting);
 r.addEventListener('updatefound',()=>{const n=r.installing;n.addEventListener('statechange',()=>{if(n.state==='installed')ask(n)})});
 }).catch(()=>{});
 let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl)return;rl=true;location.reload()});});}
</script>
