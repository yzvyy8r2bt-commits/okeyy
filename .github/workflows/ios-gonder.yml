# Hazırlanan son iPhone paketini App Store Connect / TestFlight'a gönderir.
name: "iPhone: TestFlight'a gönder"
on:
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    env:
      EXPO_ASC_KEY_ID: 2X8W7LD2TL
      EXPO_ASC_ISSUER_ID: 12c030f9-0a59-4c98-8c5b-0aa3d963bb0b
      EXPO_APPLE_TEAM_ID: 4PP3G8CF75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - name: API anahtarını dosyaya yaz
        run: |
          # telefondan kopyalanınca satırlar bozulabiliyor: anahtarı düzgün PEM biçimine getir
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t' > /tmp/k.b64
          { echo '-----BEGIN PRIVATE KEY-----'; fold -w 64 /tmp/k.b64; echo; echo '-----END PRIVATE KEY-----'; } | sed '/^$/d' > /tmp/asc.p8
          openssl pkey -in /tmp/asc.p8 -noout && echo "Anahtar biçimi doğru" || { echo "Anahtar okunamadı: ASC_KEY_P8 içeriğini kontrol et (uzunluk $(wc -c < /tmp/k.b64))"; exit 1; }
          echo "EXPO_ASC_API_KEY_PATH=/tmp/asc.p8" >> $GITHUB_ENV
      - run: eas submit --platform ios --profile production --latest --non-interactive
