# Son iPhone paketinin durumunu ve hata kaydını gösterir
name: "EAS: son paket durumu"
on:
  workflow_dispatch:
jobs:
  durum:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install --silent
      - run: |
          eas build:list --platform ios --limit 1 --json --non-interactive > /tmp/b.json
          ID=$(node -e "console.log(require('/tmp/b.json')[0].id)")
          eas build:view $ID --json > /tmp/v.json || true
          node -e "const b=require('/tmp/v.json');console.log('DURUM',b.status);console.log('HATA',JSON.stringify(b.error||null));console.log('ANAHTARLAR',Object.keys(b).join(','));(b.logFiles||[]).forEach(u=>console.log('LOG',u.slice(0,80)))"
          for u in $(node -e "(require('/tmp/v.json').logFiles||[]).forEach(u=>console.log(u))"); do curl -sL "$u" > /tmp/l.txt; node -e "const s=require('fs').readFileSync('/tmp/l.txt','utf8');const L=s.split('\n').map(l=>{try{const o=JSON.parse(l);return (o.phase||'')+' | '+(o.msg||'')}catch(e){return l}});const i=L.findIndex(x=>/CONFIGURE_XCODE_PROJECT|error|Error/.test(x));L.filter(x=>/CONFIGURE_XCODE|rror|warn/.test(x)).slice(-60).forEach(x=>console.log('KAYIT',x.slice(0,500)))"; done
