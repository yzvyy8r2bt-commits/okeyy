# iPhone paketi + TestFlight'a yükleme.
# GitHub'da "Actions" → "iPhone: TestFlight'a yükle" → "Run workflow" ile başlatılır.
# Gerekli gizli anahtarlar (Settings → Secrets → Actions):
#   EXPO_TOKEN          : Expo erişim anahtarı (zaten var)
#   ASC_KEY_P8          : İndirilen AuthKey_2X8W7LD2TL.p8 dosyasının içeriği (-----BEGIN PRIVATE KEY----- ile başlayan metin)
# Key ID / Issuer ID / Team ID gizli değil, aşağıda yazılı.
name: "iPhone: paket hazırla"
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    env:
      EXPO_ASC_KEY_ID: 2X8W7LD2TL
      EXPO_ASC_ISSUER_ID: 12c030f9-0a59-4c98-8c5b-0aa3d963bb0b
      EXPO_APPLE_TEAM_ID: 4PP3G8CF75
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Paketleri kur
        run: |
          npm install
          npx expo install --fix
      - name: API anahtarını dosyaya yaz
        run: |
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > /tmp/asc.p8
          echo "EXPO_ASC_API_KEY_PATH=/tmp/asc.p8" >> $GITHUB_ENV
      - name: iPhone paketini hazırla
        run: |
          if [ ! -s /tmp/asc.p8 ]; then echo "ASC_KEY_P8 gizli anahtarı eksik"; exit 1; fi
          eas build --platform ios --profile production --non-interactive --no-wait
